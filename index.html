<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="description" content="Evelyn Sinclair - Creative Director specializing in high-end digital experiences and meticulous design." />
    
    <!-- Open Graph Tags -->
    <meta property="og:title" content="Sinclair Creative | Luxury Digital Experiences" />
    <meta property="og:description" content="Evelyn Sinclair - Creative Director specializing in high-end digital experiences and meticulous design." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/profile.webp" />

    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <title>Sinclair Creative</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- Critical CSS to prevent FOUT and Layout Shift on initial paint -->
    <style id="critical-css">
      :root {
        --navy: #0a1628;
        --purple: #2d1b69;
        --gold: #d4af37;
        --gold-light: #ebd071;
        --soft-white: #f5f5f5;
        --gray-inactive: #dddddd;
        --gray-disabled: #999999;
        --font-serif: 'Playfair Display', serif;
        --font-sans: 'Inter', sans-serif;
      }
      html { font-size: 16px; background-color: var(--navy); }
      @media (min-width: 768px) { html { font-size: 18px; } }
      body {
        margin: 0;
        padding: 0;
        background-color: var(--navy);
        color: var(--soft-white);
        font-family: var(--font-sans);
        overflow-x: hidden;
      }
      #app { display: block; width: 100vw; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
